# Per-PR preview deploys to IPFS (the Vercel-preview equivalent). On every push
# to an open PR, builds and pins the bundle to Filebase, then posts/updates a PR
# comment with the unique preview URL. Previews only produce immutable CIDs and
# never repoint the prod IPNS/domain, so they cannot affect the live site.
#
# Secrets needed: FILEBASE_RPC_TOKEN and BUILD_ENV (the contents of the prod
# .env, i.e. the NEXT_PUBLIC_* lines). Note: secrets are NOT available to PRs
# opened from forks (GitHub security), so fork PRs won't get a preview.
name: Preview deploy (IPFS)

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

# One in-flight preview per PR; newer pushes cancel older runs.
concurrency:
  group: ipfs-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from package.json packageManager

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # BUILD_ENV holds the prod .env contents (the NEXT_PUBLIC_* lines). Vite
      # reads .env.local at build time and bakes the values into the bundle.
      - name: Write build env
        env:
          BUILD_ENV: ${{ secrets.BUILD_ENV }}
        run: |
          printf '%s\n' "$BUILD_ENV" > .env.local
          if ! grep -q '^NEXT_PUBLIC_SNOWBRIDGE_ENV=' .env.local; then
            echo "::error::BUILD_ENV secret is empty or missing NEXT_PUBLIC_SNOWBRIDGE_ENV. Set the BUILD_ENV repo secret to the NEXT_PUBLIC_* lines of your prod .env."
            exit 1
          fi

      - name: Build
        run: pnpm build

      - name: Unpin this PR's previous preview (conserve Filebase quota)
        env:
          FILEBASE_RPC_TOKEN: ${{ secrets.FILEBASE_RPC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
        run: |
          set -euo pipefail
          prev=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json comments \
            --jq '[.comments[] | select(.body | contains("<!-- ipfs-preview -->")) | .body] | last // ""' \
            | grep -oE 'bafy[a-z2-7]+' | tail -1 || true)
          if [ -n "${prev:-}" ]; then
            curl -s -X POST -H "Authorization: Bearer ${FILEBASE_RPC_TOKEN}" \
              "https://rpc.filebase.io/api/v0/pin/rm?arg=${prev}" >/dev/null || true
            echo "Unpinned previous preview CID: ${prev}"
          fi

      - name: Pin dist/ to IPFS via Filebase
        id: pin
        env:
          FILEBASE_RPC_TOKEN: ${{ secrets.FILEBASE_RPC_TOKEN }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r f; do
            args+=(-F "file=@${f};filename=${f#dist/}")
          done < <(find dist -type f | sort)
          resp=$(curl -sf -X POST \
            -H "Authorization: Bearer ${FILEBASE_RPC_TOKEN}" \
            "https://rpc.filebase.io/api/v0/add?wrap-with-directory=true&cid-version=1&pin=true" \
            "${args[@]}")
          cid=$(printf '%s\n' "$resp" | tail -n 1 | jq -r '.Hash')
          [ -n "$cid" ] && [ "$cid" != "null" ] || { echo "Failed to parse CID:"; echo "$resp"; exit 1; }
          echo "cid=$cid" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          CID: ${{ steps.pin.outputs.cid }}
        run: |
          set -euo pipefail
          {
            echo "<!-- ipfs-preview -->"
            echo "🛰 **IPFS preview deployed** (commit \`${GITHUB_SHA::7}\`)"
            echo ""
            echo "- Root CID: \`${CID}\`"
            echo "- Preview: https://${CID}.ipfs.dweb.link/"
            echo ""
            echo "Content-addressed CID, isolated from prod. Updated on each push."
          } > preview-comment.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file preview-comment.md --edit-last \
            || gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file preview-comment.md

  # When a PR closes (merged or not), unpin its preview so it stops counting
  # against the Filebase quota.
  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Unpin this PR's preview
        env:
          FILEBASE_RPC_TOKEN: ${{ secrets.FILEBASE_RPC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
        run: |
          set -euo pipefail
          cid=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json comments \
            --jq '[.comments[] | select(.body | contains("<!-- ipfs-preview -->")) | .body] | last // ""' \
            | grep -oE 'bafy[a-z2-7]+' | tail -1 || true)
          if [ -n "${cid:-}" ]; then
            curl -s -X POST -H "Authorization: Bearer ${FILEBASE_RPC_TOKEN}" \
              "https://rpc.filebase.io/api/v0/pin/rm?arg=${cid}" >/dev/null || true
            echo "Unpinned preview for closed PR #${PR}: ${cid}"
          fi
